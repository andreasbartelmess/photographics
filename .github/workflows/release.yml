name: Release

# Neue Version veröffentlichen: versionName/versionCode in app/build.gradle.kts erhöhen, dann
#   git tag v0.3.0 && git push origin v0.3.0
# Signiert wird mit den Repository-Secrets PG_KEYSTORE_BASE64, PG_KEYSTORE_PASSWORD, PG_KEY_ALIAS,
# PG_KEY_PASSWORD (siehe tools/create_release_key.sh). Ohne Secrets bricht der Workflow ab.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests and memory stress test
        run: ./gradlew :core:test :core:memoryTest --console=plain

      - name: Decode signing key
        env:
          PG_KEYSTORE_BASE64: ${{ secrets.PG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$PG_KEYSTORE_BASE64" ]; then echo "::error::Secret PG_KEYSTORE_BASE64 fehlt"; exit 1; fi
          echo "$PG_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "PG_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APKs
        env:
          PG_KEYSTORE_PASSWORD: ${{ secrets.PG_KEYSTORE_PASSWORD }}
          PG_KEY_ALIAS: ${{ secrets.PG_KEY_ALIAS }}
          PG_KEY_PASSWORD: ${{ secrets.PG_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --console=plain

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: app/build/outputs/apk/release/*.apk
