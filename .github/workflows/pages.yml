name: Website

# Veröffentlicht den Ordner website/ auf GitHub Pages (photographics.andreasbartelmess.de), dazu das
# Flatpak-Repository unter /flatpak/repo/ aus dem Anhang photographics-flatpak-repo.tar des neuesten
# Releases (hochgeladen von gnome/flatpak/publish.sh, das diesen Workflow auch anstößt).
on:
  push:
    branches: [main]
    paths: ['website/**', '.github/workflows/pages.yml']
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Flatpak repository from the newest release that has one
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Nicht jedes Release enthält eine Linux-Fassung (z. B. reine Android-Updates): sonst
          # verschwände das Repository von der Website und installierte Fassungen bekämen keine Updates
          found=""
          for tag in $(gh release list --repo "${{ github.repository }}" --exclude-drafts --limit 30 --json tagName --jq '.[].tagName'); do
            if gh release download "$tag" --repo "${{ github.repository }}" --pattern photographics-flatpak-repo.tar --dir "$RUNNER_TEMP/fp" 2>/dev/null; then
              found="$tag"; break
            fi
          done
          if [ -n "$found" ]; then
            mkdir -p website/flatpak
            tar -xf "$RUNNER_TEMP/fp/photographics-flatpak-repo.tar" -C website/flatpak
            echo "Flatpak-Repository aus $found"; du -sh website/flatpak/repo
          else
            echo "::warning::Kein Release mit Flatpak-Repository gefunden"
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          # Das Flatpak-Repository hat viele kleine Dateien; das Verteilen dauert bei GitHub teils über 10 Minuten
          timeout: 1800000
