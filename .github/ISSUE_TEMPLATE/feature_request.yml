name: Feature request
description: Suggest a tool, filter or workflow improvement
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What do you want to do?
      description: Describe the task or workflow (e.g. "retouch on the tablet, then continue in Photoshop on the desktop").
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could it work?
      description: How does Photoshop or another app solve it?
